version: v2

modules:
  - path: proto
    name: buf.build/liujitcn/kratos-core
    lint:
      use:
        - STANDARD
      except:
        - ENUM_VALUE_PREFIX
        - ENUM_ZERO_VALUE_SUFFIX
    breaking:
      use:
        - FILE

deps:
  - buf.build/kratos/apis
  - buf.build/gnostic/gnostic

lint:
  use:
    - DEFAULT

breaking:
  use:
    - FILE
