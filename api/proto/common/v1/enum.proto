syntax = "proto3";

package common.v1;

option go_package = "github.com/liujitcn/kratos-core/api/gen/go/common/v1;commonv1";

// 状态
enum Status {
  STATUS_UNSPECIFIED = 0; // 未知状态
  STATUS_ENABLE = 1; // 启用
  STATUS_DISABLE = 2; // 禁用
}

// 定时任务日志状态
enum BaseJobLogStatus {
  BASE_JOB_LOG_STATUS_UNSPECIFIED = 0; // 未指定定时任务日志状态
  BASE_JOB_LOG_STATUS_SUCCESS = 1; // 成功
  BASE_JOB_LOG_STATUS_FAIL = 2; // 失败
}
